n.","back":"Verifiziere Quelle, Jahr und Bezugsgröße.","effect":"Impro-Ziel: Rückseite bis zum freien Erklärversuch sperrbar."},{"id":"U005","cat":"ARGUMENT","title":"Solidarität","front":"Biete einen sachlichen Bezug zu gemeinsamer Verantwortung.","back":"Kein moralischer Vergleich oder Schuldappell.","effect":"Impro-Ziel: Rückseite bis zum freien Erklärversuch sperrbar."},{"id":"U006","cat":"ARGUMENT","title":"Konkrete Hilfe","front":"Erkläre eine reale Tätigkeit der NGO.","back":"Nicht behaupten, ein Betrag rette garantiert eine Person.","effect":"Impro-Ziel: Rückseite bis zum freien Erklärversuch sperrbar."},{"id":"U007","cat":"ARGUMENT","title":"Lokale Partnerschaft","front":"Beschreibe belegte Zusammenarbeit vor Ort.","back":"Menschen als Handelnde zeigen, nicht als passive Kulisse.","effect":"Impro-Ziel: Rückseite bis zum freien Erklärversuch sperrbar."},{"id":"U008","cat":"ARGUMENT","title":"Wahlfreiheit","front":"Nenne realistische Unterstützungswege.","back":"Keine künstliche Knappheit. Kein Druck.","effect":"Impro-Ziel: Rückseite bis zum freien Erklärversuch sperrbar."},{"id":"U009","cat":"ARGUMENT","title":"Fakten statt Mythos","front":"Korrigiere eine überprüfbare Falschinformation.","back":"Ruhig; wenn unklar, nachprüfen.","effect":"Impro-Ziel: Rückseite bis zum freien Erklärversuch sperrbar."},{"id":"U010","cat":"ARGUMENT","title":"Gemeinsames Interesse","front":"Knüpfe an ein ausdrücklich genanntes Anliegen an.","back":"Nicht aus Alter, Kleidung oder Herkunft ableiten.","effect":"Impro-Ziel: Rückseite bis zum freien Erklärversuch sperrbar."},{"id":"U011","cat":"ARGUMENT","title":"Social Proof – geprüft","front":"Nenne belegte Unterstützung, falls relevant.","back":"Keine erfundenen Zahlen oder sozialer Gruppenzwang.","effect":"Impro-Ziel: Rückseite bis zum freien Erklärversuch sperrbar."},{"id":"U012","cat":"ARGUMENT","title":"Was wir nicht wissen","front":"Benenne Grenzen von Projektdaten.","back":"Ehrlichkeit statt Scheinsicherheit.","effect":"Impro-Ziel: Rückseite bis zum freien Erklärversuch sperrbar."},{"id":"C001","cat":"CTA","title":"Dauerspende","front":"Frage freiwillig nach regelmäßiger Unterstützung.","back":"Nur bei erkennbarem Interesse, Verständnis, freier Entscheidung und klaren Bedingungen.","effect":"Nur freiwilliger, situativ passender nächster Schritt."},{"id":"C002","cat":"CTA","title":"Einmalspende","front":"Nenne die Option, falls die NGO sie anbietet.","back":"Nur auf Wunsch; im Spiel als I notieren.","effect":"Nur freiwilliger, situativ passender nächster Schritt."},{"id":"C003","cat":"CTA","title":"Offizielle Website","front":"Biete einen offiziellen Link an.","back":"Kein Tracking oder Kontakt ohne Wunsch; I nur bei Annahme.","effect":"Nur freiwilliger, situativ passender nächster Schritt."},{"id":"C004","cat":"CTA","title":"Später nachlesen","front":"Gib auf Wunsch neutrale Information mit.","back":"Keine Daten sammeln und keine Bedenkzeit verkürzen.","effect":"Nur freiwilliger, situativ passender nächster Schritt."},{"id":"C005","cat":"CTA","title":"Ehrenamt","front":"Frage, ob andere Formen der Hilfe interessieren.","back":"Nur bestätigte Möglichkeiten nennen.","effect":"Nur freiwilliger, situativ passender nächster Schritt."},{"id":"C006","cat":"CTA","title":"Newsletter","front":"Biete eine freiwillige Anmeldung an.","back":"Echte Einwilligung und Datenschutz; kein vorangekreuztes Feld.","effect":"Nur freiwilliger, situativ passender nächster Schritt."},{"id":"C007","cat":"CTA","title":"Kein weiterer Schritt","front":"Danke sagen und freundlich gehen.","back":"Wichtig bei Ablehnung, Zeitdruck oder Unsicherheit.","effect":"Nur freiwilliger, situativ passender nächster Schritt."},{"id":"C008","cat":"CTA","title":"Nachfrage erlauben","front":"Biete eine offizielle Kontaktstelle an.","back":"Keine private Erreichbarkeit erzwingen.","effect":"Nur freiwilliger, situativ passender nächster Schritt."},{"id":"S001","cat":"STÖRUNG","title":"Hund zieht weiter","front":"Die Leine spannt sich, die Person muss gehen.","back":"Verkürzen oder freundlich beenden; nicht Tier oder Weg blockieren.","effect":"Aktiver Einwurf: nur Außenrolle, höchstens eine pro Person und Pitch."},{"id":"S002","cat":"STÖRUNG","title":"Kind will weiter","front":"Das Kind weint und möchte gehen.","back":"Beenden oder nur auf Wunsch einen Link geben; keine Schuldgefühle.","effect":"Aktiver Einwurf: nur Außenrolle, höchstens eine pro Person und Pitch."},{"id":"S003","cat":"STÖRUNG","title":"Lauter Kritiker","front":"Dritte Person beleidigt die NGO.","back":"Nicht zurückbeleidigen; Abstand; Gespräch nur bei Zustimmung fortsetzen.","effect":"Aktiver Einwurf: nur Außenrolle, höchstens eine pro Person und Pitch."},{"id":"S004","cat":"STÖRUNG","title":"Bus kommt","front":"Die Person muss zur Haltestelle.","back":"Weg freigeben. Kein Zeitdruck aufbauen.","effect":"Aktiver Einwurf: nur Außenrolle, höchstens eine pro Person und Pitch."},{"id":"S005","cat":"STÖRUNG","title":"Anruf","front":"Handy klingelt während Gespräch.","back":"Unterbrechen; Person entscheidet, ob sie zurückkommt.","effect":"Aktiver Einwurf: nur Außenrolle, höchstens eine pro Person und Pitch."},{"id":"S006","cat":"STÖRUNG","title":"Regen","front":"Plötzlich starker Regen.","back":"Sicherheit und Wetterschutz; nicht festhalten.","effect":"Aktiver Einwurf: nur Außenrolle, höchstens eine pro Person und Pitch."},{"id":"S007","cat":"STÖRUNG","title":"Tablet offline","front":"Keine sichere Eingabe möglich.","back":"Keine Bankdaten privat notieren; offiziellen späteren Weg nennen.","effect":"Aktiver Einwurf: nur Außenrolle, höchstens eine pro Person und Pitch."},{"id":"S008","cat":"STÖRUNG","title":"Akku leer","front":"Das Gerät schaltet ab.","back":"Backup nach Teamregel; sonst Information oder Ende.","effect":"Aktiver Einwurf: nur Außenrolle, höchstens eine pro Person und Pitch."},{"id":"S009","cat":"STÖRUNG","title":"Teamstreit","front":"Kolleg*in widerspricht vor der Person.","back":"Ruhig Klärung anbieten; später intern deb luss ohne sicheres Verständnis.","effect":"Aktiver Einwurf: nur Außenrolle, höchstens eine pro Person und Pitch."},{"id":"S018","cat":"STÖRUNG","title":"Zu viele Fragen","front":"Person fragt schneller als du antworten kannst.","back":"Priorität klären; Quellen anbieten, ohne auszuweichen.","effect":"Aktiver Einwurf: nur Außenrolle, höchstens eine pro Person und Pitch."},{"id":"S019","cat":"STÖRUNG","title":"Schichtmüdigkeit","front":"Du bist nach Stunden erschöpft.","back":"Pause, Wasser, Ablösung; kein Durchhalten um jeden Preis.","effect":"Aktiver Einwurf: nur Außenrolle, höchstens eine pro Person und Pitch."},{"id":"S020","cat":"STÖRUNG","title":"Spontane Demo","front":"Straße wird voll und unübersichtlich.","back":"Standort- und Sicherheitsregeln befolgen; bei Gefahr beenden.","effect":"Aktiver Einwurf: nur Außenrolle, höchstens eine pro Person und Pitch."},{"id":"E001","cat":"EMERGENCY","title":"Alkohol / Rausch","front":"Person ist erkennbar beeinträchtigt.","back":"Kein Abschluss, keine Datenerfassung. Respektvoll beenden; bei Not angemessene Hilfe.","effect":"Sicherheitskarte: sofortige Unterbrechung; nie Einwurf-Handkarte."},{"id":"E002","cat":"EMERGENCY","title":"Minderjährig","front":"Eine Person ist minderjährig.","back":"Keine Spendenverpflichtung im Trainingsspiel; keine Daten erheben.","effect":"Sicherheitskarte: sofortige Unterbrechung; nie Einwurf-Handkarte."},{"id":"E003","cat":"EMERGENCY","title":"Akute Notlage","front":"Person wirkt akut hilfsbedürftig.","back":"Fundraising beenden; geeignete Hilfe anbieten, bei Notrufbedarf 112.","effect":"Sicherheitskarte: sofortige Unterbrechung; nie Einwurf-Handkarte."},{"id":"E004","cat":"EMERGENCY","title":"Bedrohung","front":"Eine Person droht körperlich.","back":"Distanz, Rückzug, Team informieren; bei akuter Gefahr 110.","effect":"Sicherheitskarte: sofortige Unterbrechung; nie Einwurf-Handkarte."},{"id":"E005","cat":"EMERGENCY","title":"Keine freie Entscheidung","front":"Begleitung drängt die Person zur eenden\nRollenimpuls: Autonomie.","effect":"Ausgangslage, Grenzen und erlaubtes Ergebnis nur für Passant*innen-Rolle.","tag":"GERECHT","cap":"N"},{"id":"F029","cat":"FRAGE","title":"Gemeinsam entscheiden?","front":"„Ich bespreche solche Ausgaben lieber mit meiner Bezugsperson.“","back":"Akzeptiere die Bedenkzeit. Biete auf Wunsch eine offizielle Quelle an. Kein Drängen zur Unterschrift oder Nachfrage nach Beziehungsdetails.","effect":"Frage stellen, ohne die Antwort vorzugeben."},{"id":"F030","cat":"FRAGE","title":"Wer gehört zur Familie?","front":"„Warum gehst du davon aus, dass wir verheiratet sind?“","back":"Entschuldige dich kurz. Nutze neutrale Ansprache und frage nur, was für das Gespräch relevant ist. Keine Rechtfertigung verlangen.","effect":"Frage stellen, ohne die Antwort vorzugeben."},{"id":"S023","cat":"STÖRUNG","title":"Begleitung widerspricht","front":"Die angesprochene Person will zuhören. Eine Begleitperson drängt weiter.","back":"Kläre, ob die angesprochene Person überhaupt fortfahren möchte. Respektiere ihr Nein und die Zeit der Begleitung. Nicht gegeneinander ausspielen.","effect":"Aktiver Einwurf: nur Außenrolle, höchstens eine pro Person und Pitch."},{"id":"W037","cat":"WISSEN","title":"Familienvielfalt","front":"Beziehung nicht voraussetzen.","back":"Nutze Person, Begleitung oder Bezugsperson statt Ehefrau/Ehemann als Vermutung. Spendenentscheidungen sind individuell; Rücksprache respektieren. Reflektiere eigene Annahmen.","effect":"Impro-Ziel: Rückseite bis zum freien Erklärversuch sperrbar."},{"id":"H001","cat":"UNTERSTÜTZUNG","title":"Luft holen","front":"Schenke dem Teammitglied fünf Sekunden zum Nachdenken.","back":"Einwurf: „Kurze Pause – du darfst neu ansetzen.“ Die F2F-Person entscheidet, ob sie den Impuls nutzt. Kein künstlicher Zeitdruck.","effect":"Aktive Unterstützung durch außenstehende Mitspielende."},{"id":"H002","cat":"UNTERSTÜTZUNG","title":"Nachfrage statt Monolog","front":"Hilf dabei, eine offene Frage einzubauen.","back":"Einwurf: „Welche Frage würde echte Interessen sichtbar machen?“ Nicht aus der Person Merkmale ableiten.","effect":"Aktive Unterstützung durch außenstehende Mitspielende."},{"id":"H003","cat":"UNTERSTÜTZUNG","title":"Offizielle Quelle","front":"Biete einen überprüfbaren Informationsweg an.","back":"Einwurf: „Zeig lieber eine offizielle Quelle als eine Zahl aus dem Gedächtnis.“ Keine erfundene Statistik.","effect":"Aktive Unterstützung durch außenstehende Mitspielende."},{"id":"H004","cat":"UNTERSTÜTZUNG","title":"Andere Kommunikationsform","front":"Erinnere an einen zugänglichen Gesprächsweg.","back":"Einwurf: „Möchte die Person eine kürzere, schriftliche oder ruhigere Erklärung?“ Nur auf Wunsch.","effect":"Aktive Unterstützung durch außenstehende Mitspielende."},{"id":"H005","cat":"UNTERSTÜTZUNG","title":"Kolleg*innen-Backup","front":"Biete fachliche Hilfe aus dem Team an.","back":"Einwurf: „Soll ich eine konkrete Frage beantworten?“ Nur wenn die angesprochene Person zustimmt; keine Doppelansprache.","effect":"Aktive Unterstützung durch außenstehende Mitspielende."},{"id":"H006","cat":"UNTERSTÜTZUNG","title":"Kurz zusammenfassen","front":"Hilf, das Anliegen der Person richtig zu verstehen.","back":"Einwurf: „Fasse in einem Satz zusammen, was du gehört hast.“ Danach nachfragen, ob es stimmt.","effect":"Aktive Unterstützung durch außenstehende Mitspielende."},{"id":"H007","cat":"UNTERSTÜTZUNG","title":"Wahlfreiheit sichern","front":"Erinnere daran, dass Nichtspenden eine legitime Option ist.","back":"Einwurf: „Eine freie Entscheidung kann auch Nein heißen.“ Kein schlechtes Gewissen erzeugen.","effect":"Aktive Unterstützung durch außenstehende Mitspielende."},{"id":"H008","cat":"UNTERSTÜTZUNG","title":"Tempo rausnehmen","front":"Bringe Ruhe in ein hektisches Gespräch.","back":"Einwurf: „Ein Satz weniger und Raum für eine Antwort.“ Das Gegenüber entscheidet über die Dauer.","effect":"Aktive Unterstützung durch außenstehende Mitspielende."},{"id":"H009","cat":"UNTERSTÜTZUNG","title":"Pausencheck","front":"Ermögliche eine sichere Pause oder Ablösung.","back":"Einwurf: „Braucht jemand eine Pause?“ Bei Belastung Sicherheit und Gesundheit vor dem Ziel.","effect":"Aktive Unterstützung durch außenstehende Mitspielende."},{"id":"H010","cat":"UNTERSTÜTZUNG","title":"Fehler freundlich korrigieren","front":"Eröffne einen Weg zur transparenten Korrektur.","back":"Einwurf: „Du kannst die vorige Aussage korrigieren.“ Fehler klar benennen, nicht vertuschen.","effect":"Aktive Unterstützung durch außenstehende Mitspielende."},{"id":"H011","cat":"UNTERSTÜTZUNG","title":"Projektbezug","front":"Verbinde die Aussage mit einer passenden NGO-Aufgabe.","back":"Einwurf: „Was macht die Organisation konkret?“ Nur belegte Tätigkeiten nennen, keine Erfolgsversprechen.","effect":"Aktive Unterstützung durch außenstehende Mitspielende."},{"id":"H012","cat":"UNTERSTÜTZUNG","title":"Kritik annehmen","front":"Hilf, einen berechtigten Einwand anzuerkennen.","back":"Einwurf: „Frag nach, worauf sich die Kritik bezieht.“ Keine Abwertung und kein defensives Überreden.","effect":"Aktive Unterstützung durch außenstehende Mitspielende."},{"id":"H013","cat":"UNTERSTÜTZUNG","title":"Guter Abschluss ohne Spende","front":"Unterstütze ein respektvolles Ende.","back":"Einwurf: „Ein Dank und ein klarer Abschluss reichen aus.“ Kein nachgeschobenes Umstimmen.","effect":"Aktive Unterstützung durch außenstehende Mitspielende."},{"id":"H014","cat":"UNTERSTÜTZUNG","title":"Perspektivwechsel","front":"Biete einen Blick aus Sicht der angesprochenen Person.","back":"Einwurf: „Was braucht die Person gerade?“ Nachfrage statt Annahmen über Aussehen oder Gruppe.","effect":"Aktive Unterstützung durch außenstehende Mitspielende."},{"id":"H015","cat":"UNTERSTÜTZUNG","title":"Team schützt Grenzen","front":"Stärke Kolleg*innen bei Druck oder Abwertung.","back":"Einwurf: „Du musst keine unsichere Situation fortsetzen.“ Rückzug und Teamregel sind legitim.","effect":"Aktive Unterstützung durch außenstehende Mitspielende."},{"id":"H016","cat":"UNTERSTÜTZUNG","title":"Alternative auf Wunsch","front":"Biete eine passende, nichtdrängende Möglichkeit an.","back":"Einwurf: „Wenn du möchtest: offizielle Website, Information oder Ende.“ Nur tatsächlich angebotene Optionen nennen.","effect":"Aktive Unterstützung durch außenstehende Mitspielende."},{"id":"I001","cat":"IMPRO","title":"Ohne Fachsprache","front":"Erkläre die Idee in einfachen Worten.","back":"10–20 Sekunden ohne Rückseite. Keine Abkürzungen oder Fachwörter voraussetzen. Nach dem Versuch Rückseite umdrehen und gemeinsam prüfen.","effect":"Sperrt Rückseite einer offen gelegten Theorie- oder Überzeugungskarte."},{"id":"I002","cat":"IMPRO","title":"Ein Satz zählt","front":"Erkläre den Kern in einem klaren Satz.","back":"10–20 Sekunden ohne Rückseite: Was ist die wichtigste Aussage? Danach Rückseite prüfen und bei Bedarf selbst korrigieren.","effect":"Sperrt Rückseite einer offen gelegten Theorie- oder Überzeugungskarte."},{"id":"I003","cat":"IMPRO","title":"Beispiel, aber ehrlich","front":"Veranschauliche den Inhalt ohne etwas zu erfinden.","back":"10–20 Sekunden ohne Rückseite. Nutze ein belegtes Beispiel oder kennzeichne ein hypothetisches Beispiel klar. Dann Rückseite prüfen.","effect":"Sperrt Rückseite einer offen gelegten Theorie- oder Überzeugungskarte."},{"id":"I004","cat":"IMPRO","title":"Ja, und …","front":"Nimm den Gedanken der Person auf und ergänze einen passenden, belegbaren NGO-Bezug.","back":"Technik: Yes, And / Angebot annehmen. Reagiere mit einer Anerkennung und einem ergänzenden Gedanken: „Sie fragen nach der Wirkung – dazu kann ich erklären …“. Behauptungen der Person nicht ungeprüft bestätigen. Danach Rückseite der Zielkarte prüfen.","effect":"EINWURF: Auf Theorie oder NGO-Überzeugung werfen. Rückseite bis zur Improvisation gesperrt."},{"id":"I005","cat":"IMPRO","title":"Statuswechsel","front":"Wechsle nach dem ersten Satz von der Expert*innenrolle in die Zuhörrolle.","back":"Technik: Status Switch. Beginne mit einer klaren Erklärung, danach eine kurze offene Frage und wirklich zuhören. Kein Dominanzspiel, keine künstliche Unterordnung oder Bewertung der angesprochenen Person. Danach die Zielkarten-Rückseite prüfen.","effect":"EINWURF: Auf Theorie oder NGO-Überzeugung werfen. Rückseite bis zur Improvisation gesperrt."},{"id":"I006","cat":"IMPRO","title":"Genrewechsel","front":"Erkläre das Thema wie den Einstieg in einen sachlichen Podcast: kurz, verständlich, ohne Pathos.","back":"Technik: Genre Switch. Nutze einen überraschend klaren Einstieg und anschließend einen belegbaren Fakt. Keine Schlagzeilen, erfundenen O-Töne oder dramatischen Übertreibungen über Hilfsbedürftige. Danach Rückseite prüfen.","effect":"EINWURF: Auf Theorie oder NGO-Überzeugung werfen. Rückseite bis zur Improvisation gesperrt."},{"id":"I007","cat":"IMPRO","title":"Fragen-Pingpong","front":"Formuliere zwei offene Fragen, die zum Thema führen. Gib anschließend selbst eine kurze Antwort.","back":"Technik: Questions Only, für F2F angepasst. Die Fragen dienen der Verständigung und sind keine Fangfragen. Beispiel: „Was wäre Ihnen bei Transparenz wichtig?“ – „Welche Angaben würden helfen?“ Dann sachlich erklären und Zielkarte prüfen.","effect":"EINWURF: Auf Theorie oder NGO-Überzeugung werfen. Rückseite bis zur Improvisation gesperrt."},{"id":"I008","cat":"IMPRO","title":"Freeze & Reframe","front":"STOPP im Pitch! Halte zwei Sekunden inne und erkläre den letzten Gedanken neu.","back":"Technik: Freeze / Reframe. Nicht das Gespräch einfrieren, sondern den eigenen Redefluss: Pause, neue Formulierung, weiter. Das Gegenüber behält jederzeit das Recht, zu gehen. Danach die Rückseite prüfen.","effect":"EINWURF: Auf Theorie oder NGO-Überzeugung werfen. Rückseite bis zur Improvisation gesperrt."},{"id":"I009","cat":"IMPRO","title":"Drei-Wort-Impuls","front":"Baue die drei Begriffe „Vertrauen – Wahl – Wirkung“ sinnvoll in deine Erklärung ein.","back":"Technik: Word Association / Stichwort-Impro. Die drei Begriffe müssen logisch und wahrheitsgemäß auftauchen; keine künstlichen Versprechen oder Manipulation. Kein zusätzlicher Einwurf nötig. Danach Zielkarte prüfen.","effect":"EINWURF: Auf Theorie oder NGO-Überzeugung werfen. Rückseite bis zur Improvisation gesperrt."},{"id":"I010","cat":"IMPRO","title":"Story Spine","front":"Erkläre die NGO-Arbeit in drei Stationen: Ausgangslage – Herausforderung – Antwort.","back":"Technik: Story Spine (nach Kenn Adams), stark verkürzt. Beschreibe eine reale oder klar hypothetische Ausgangslage, die Herausforderung und eine belegte Tätigkeit der NGO. Erfinde keine persönlichen Schicksale und garantiere keinen Erfolg. Dann Rückseite prüfen.","effect":"EINWURF: Auf Theorie oder NGO-Überzeugung werfen. Rückseite bis zur Improvisation gesperrt."},{"id":"I011","cat":"IMPRO","title":"Perspektivwechsel","front":"Beginne mit der Frage: „Warum könnte das für Sie gerade relevant sein?“ Antworte ohne Annahmen.","back":"Technik: Point of View. Wechsle gedanklich zur Sicht des Gegenübers, ohne zu behaupten, dessen Gedanken zu kennen. Formuliere eine offene Frage oder biete eine neutrale Erklärung an. Danach Zielkarte prüfen.","effect":"EINWURF: Auf Theorie oder NGO-Überzeugung werfen. Rückseite bis zur Improvisation gesperrt."},{"id":"I012","cat":"IMPRO","title":"ABC-Pitch","front":"Starte drei aufeinanderfolgende Sätze mit A, B und C.","back":"Technik: Alphabet Game, als Mini-Aufgabe. Beispiel: „Auf …“ / „Bei …“ / „Clever wäre …“. Es geht um sprachliche Flexibilität, nicht um Unsinn. Wenn es unpassend wird: ehrlich stoppen und zur normalen Erklärung zurückkehren. Danach Rückseite prüfen.","effect":"EINWURF: Auf Theorie oder NGO-Überzeugung werfen. Rückseite bis zur Improvisation gesperrt."},{"id":"I013","cat":"IMPRO","title":"Callback","front":"Greife ein Wort auf, das dein Gegenüber zuvor tatsächlich benutzt hat.","back":"Technik: Callback. Nutze einen gehörten Begriff, um einen nachvollziehbaren Bezug zum Thema herzustellen. Keine Schein-Nähe und keine Unterstellung: Falls kein Wort passt, benenne das und bleibe sachlich. Danach Zielkarte prüfen.","effect":"EINWURF: Auf Theorie oder NGO-Überzeugung werfen. Rückseite bis zur Improvisation gesperrt."},{"id":"I014","cat":"IMPRO","title":"Metapher-Moment","front":"Erkläre das Konzept mit einem bildlichen Vergleich – und nenne dessen Grenze.","back":"Technik: Object Work / Analogie. Beispiel: „Regelmäßige Spenden sind wie eine planbare Grundlage“ – aber nur, soweit es für die NGO zutrifft. Keine unzutreffenden Zahlen oder Bilder, die Menschen entwürdigen. Danach Rückseite prüfen.","effect":"EINWURF: Auf Theorie oder NGO-Überzeugung werfen. Rückseite bis zur Improvisation gesperrt."},{"id":"I015","cat":"IMPRO","title":"Emotionswechsel","front":"Wechsle nach einem begeisterten Satz bewusst in einen ruhigen, sachlichen Ton.","back":"Technik: Emotion Switch. Es geht nicht um künstliche Gefühle, sondern um flexibles Sprechtempo und angemessenen Tonfall. Bleibe authentisch, respektvoll und frei von Schuldappellen. Danach Zielkarte prüfen.","effect":"EINWURF: Auf Theorie oder NGO-Überzeugung werfen. Rückseite bis zur Improvisation gesperrt."},{"id":"G001","cat":"NGO-INFO","title":"Ärzte ohne Grenzen","front":"NGO: Ärzte ohne Grenzen\nGründung: 1971 (int.) · 1993 (DE)\nMission: Unabhängige medizinische Nothilfe für Menschen in Krisen und Konflikten.\nEinsatzgebiet: Weltweit, besonders in Krisen- und Konfliktregionen.","back":"Vision: Medizinische Hilfe richtet sich nach dem Bedarf – unabhängig von Grenzen und Politik.\nZiel: Behandeln, Epidemien bekämpfen und auf Notlagen öffentlich aufmerksam machen.\nGründungshinweis: Internationale Gründung; deutscher Verein seit 1993\nQuelle: https://www.aerzte-ohne-grenzen.de/unsere-organisation/geschichte-aerzte-ohne-grenzen","effect":"NGO-Basiswissen; Kategorie getrennt vom Projektdeck; keine Impro-Zielkarte.","org":"Ärzte ohne Grenzen","tag":"MED","ngoprofil_gruendungsjahr":"1971 (int.) · 1993 (DE)","ngoprofil_mission":"Unabhängige medizinische Nothilfe für Menschen in Krisen und Konflikten.","ngoprofil_vision":"Medizinische Hilfe richtet sich nach dem Bedarf – unabhängig von Grenzen und Politik.","ngoprofil_ziel":"Behandeln, Epidemien bekämpfen und auf Notlagen öffentlich aufmerksam machen.","ngoprofil_einsatzgebiet":"Weltweit, besonders in Krisen- und Konfliktregionen.","url":"https://www.aerzte-ohne-grenzen.de/unsere-organisation/geschichte-aerzte-ohne-grenzen"},{"id":"G002","cat":"NGO-INFO","title":"Save the Children","front":"NGO: Save the Children\nGründung: 1919 (international)\nMission: Kinderrechte stärken: Schutz, Bildung, Ernährung und Gesundheit.\nEinsatzgebiet: Weltweit, einschließlich Deutschland.","back":"Vision: Jedes Kind überlebt, lernt und wächst geschützt auf.\nZiel: Kinder vor Gewalt schützen und Zugang zu Bildung und Versorgung verbessern.\nGründungshinweis: Gründung der internationalen Bewegung\nQuelle: https://www.savethechildren.de/informieren/ueber-uns/100-jahre/geschichte/","effect":"NGO-Basiswissen; Kategorie getrennt vom Projektdeck; keine Impro-Zielkarte.","org":"Save the Children","tag":"KIND","ngoprofil_gruendungsjahr":"1919 (international)","ngoprofil_mission":"Kinderrechte stärken: Schutz, Bildung, Ernährung und Gesundheit.","ngoprofil_vision":"Jedes Kind überlebt, lernt und wächst geschützt auf.","ngoprofil_ziel":"Kinder vor Gewalt schützen und Zugang zu Bildung und Versorgung verbessern.","ngoprofil_einsatzgebiet":"Weltweit, einschließlich Deutschland.","url":"https://www.savethechildren.de/informieren/ueber-uns/100-jahre/geschichte/"},{"id":"G003","cat":"NGO-INFO","title":"Brot für die Welt","front":"NGO: Brot für die Welt\nGründung: 1959\nMission: Mit Partnern Armut, Hunger und Ungerechtigkeit überwinden.\nEinsatzgebiet: Internationale Entwicklungszusammenarbeit, besonders Globaler Süden.","back":"Vision: Alle Menschen leben gerecht, selbstbestimmt und in Würde.\nZiel: Ernährungssicherheit, Teilhabe, Wasser und Menschenrechte stärken.\nGründu const GALLERY_NPCS=CARDS.filter(c=>c.cat==='NPC').map(c=>c.id);
const GALLERY_PASSANTS=CARDS.filter(c=>c.cat==='PASSANT').map(c=>c.id);
const GALLERY_JOKERS=CARDS.filter(c=>c.cat==='JOKER-COACH'||c.cat==='JOKER-TEAMLEITUNG').map(c=>c.id);
let galleryIds=[];
function galleryShuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function mixGallery(){const previous=galleryIds.join('|');let result=[];
 for(let attempt=0;attempt<8;attempt++){
  // Vielfalt: sechs aktive NGO-Charaktere, vier Passant*innen und zwei Universal-Joker.
  result=galleryShuffle([...galleryShuffle(GALLERY_NPCS).slice(0,6),...galleryShuffle(GALLERY_PASSANTS).slice(0,4),...galleryShuffle(GALLERY_JOKERS).slice(0,2)]);
  if(result.join('|')!==previous)break;
 }
 galleryIds=result;
 return galleryIds;
}
function galleryCard(id){const c=by(id);if(!c)return '';
 const role=c.cat==='NPC'?'NGO-Team · '+(c.org||'F2F'):c.cat==='PASSANT'?'Passant*in · Begegnung':c.cat==='JOKER-COACH'?'Universal-Joker · Coach*in':'Universal-Joker · Teamleitung';

}
function charGallery(){if(!galleryIds.length)mixGallery();return `<section class="section panel charShowcase" aria-label="Zufällige Charaktergalerie"><div class="galleryTop"><div><div class="eyebrow">134 Figuren · viele Blickwinkel</div><h3>Wem begegnest du diesmal?</h3><p>Entdecke Figuren aus dem Kartenspiel – mit jeder Mischung entstehen neue Konstellationen.</p></div><div class="galleryNav"><button class="galleryReload" onclick="rerollGallery()" aria-label="Charakterkarten neu mischen" title="Neue Mischung">↻ &nbsp;Neu mischen</button><button class="ghost" onclick="scrollGallery(-1)" aria-label="Galerie nach links bewegen">←</button><button class="ghost" onclick="scrollGallery(1)" aria-label="Galerie nach rechts bewegen">→</button></div></div><div class="galleryTrack" id="charGallery" role="region" aria-label="Durchswipbare Charakterkarten" tabindex="0">${galleryIds.map(galleryCard).join('')}</div><div class="galleryHint">12 Karten pro Mischung · 6 NGO-Figuren + 4 Passant*innen + 2 Joker · per Finger, Touchpad oder Pfeiltasten durchswipen.</div><div class="row section"><button class="primary" onclick="goto('play')">Spiel starten</button><button class="ghost" onclick="goto('library')">Alle Charakterkarten entdecken</button></div></section>`}
function rerollGallery(){mixGallery();const el=$('charGallery');if(!el)return;el.innerHTML=galleryIds.map(galleryCard).join('');el.scrollTo({left:0,behavior:'instant'});el.focus({preventScroll:true})}

function cardFront(c){if(!c)return '';let special=c.cat.startsWith('JOKER-'),cc=c.cat==='JOKER-COACH'?'coach':c.cat==='JOKER-TEAMLEITUNG'?'lead':c.cat==='IMPRO'?'impro':c.cat==='WISSEN'?'wissen':c.cat==='STÖRUNG'?'stoerung':c.cat==='UNTERSTÜTZUNG'?'support':'';let photo=PHOTOS[c.id];let glyph=c.cat==='IMPRO'?'⚡':c.cat==='NGO-INFO'?'🌍':c.cat==='WISSEN'?'🧠':c.cat==='STÖRUNG'?'⚠':c.cat==='UNTERSTÜTZUNG'?'🤝':c.cat==='PASSANT'?'🧑':'✦';return `<div class="cardHead ${cc}"><span>${esc(LABELS[c.cat]||c.cat)}</span><span>${esc(c.id)}</span></div><div class="cardPic">${photo?`<img src="${photo}" alt="Illustration ${esc(c.title)}">`:glyph}</div><div class="cardBody"><h3>${esc(c.title)}</h3><p>${esc(c.front)}</p></div><div class="cardBottom">${special?'UNIVERSAL · ALLE NGOs':esc(c.effect||'F2F Streets')}</div>`}
function cardTile(c,on=false,extra=''){return `<article class="card ${on?'selected':''}">${cardFront(c)}<button onclick="showCard('${c.id}')">Karte ansehen</button>${extra}</article>`}
function showCard(id,justFront=false){let c=by(id);if(!c)return;modal(`${LABELS[c.cat]||c.cat} · ${id}`,`<div class="cardVisible">${PHOTOS[id]?`<img src="${PHOTOS[id]}" style="float:right;width:105px;max-width:30%;border-radius:9px" alt="Charakterportrait">`:''}<h3>${esc(c.title)}</h3><p>${esc(c.front)}</p>${justFront?'':`<hr><p>${esc(c.back)}</p><p class="tag">${esc(c.effect)}</p>`}${c.url&&/^https:\/\//.test(c.url)?`<a href="${esc(c.url)}" rel="noopener noreferrer" target="_blank">Quellenlink öffnen</a>`:''}</div>`)}
function home(){return `<section class="hero"><div class="eyebrow">Gespräche · Perspektiven · Teamplay</div><h1>JEDE BEGEGNUNG<br>IST <span style="color:var(--pink)">ANDERS.</span></h1><p class="lead">Ein Spiel über F2F-Fundraising und Begegnungen, die selten nach Plan laufen. Entdecke unterschiedliche Sichtweisen, probiere Gesprächswege aus und tausche dich im Team aus.</p><div class="row"><button class="primary" onclick="goto('play')">Spiel starten</button><button class="ghost" onclick="goto('downloads')">Materialien entdecken</button><button class="ghost" onclick="goto('rules')">Spielregeln</button><button class="ghost" onclick="goto('faq')">FAQ</button><button class="donateNav" onclick="goto('support')">Donate</button></div><div class="stats"><span class="pill">345 Druckkarten</span><span class="pill">49 digitale Trainingskarten</span><span class="pill">6 universelle Joker</span><span class="pill">3 Improkarten je Partie</span></div></section><section class="section grid grid3"><div class="panel"><div class="eyebrow">01 · Zuhören</div><h3>Vielfältige Perspektiven</h3><p>Mal führst du das Gespräch, mal bist du dein Gegenüber. Jede Rolle eröffnet einen anderen Blick.</p></div><div class="panel"><div class="eyebrow">02 · Anders reagieren</div><h3>Unerwartete Wendungen</h3><p>Wer gerade nicht im Gespräch ist, bringt mit Einwürfen neue Fragen und Wendungen ins Spiel.</p></div><div class="panel"><div class="eyebrow">03 · Reflektieren</div><h3>Auf den Umgang kommt es an</h3><p>Zuhören, respektieren und mit Unsicherheit umgehen zählt mehr als ein schneller Abschluss.</p></div></section>${charGallery()}<section class="section panel"><div class="eyebrow">Noch eine Perspektive</div><h3>Keine Runde wie die andere</h3><p>Wen triffst du heute? Wie verändert eine Frage den Verlauf? Die Charaktere und Einwurfkarten machen Raum für neue Antworten, auch wenn nicht alles gelingt.</p><div class="row"><button class="primary" onclick="goto('play')">Eine Runde ausprobieren</button><button class="ghost" onclick="goto('library')">Kartenbibliothek ansehen</button></div></section>`}
function setup(){const ns=NGO.map(n=>`<option>${esc(n)}</option>`).join('');return `<div class="eyebrow">Spiel einrichten</div><h2>Stell deine Runde zusammen</h2><div class="grid grid2"><section class="panel"><div class="field"><label for="pcount">Modus</label><select id="pcount" onchange="buildPlayers()"><option value="2">2 Personen · lokal</option><option value="3" selected>3 Personen · lokal</option><option value="4">4 Personen · lokal</option><option value="1">Solo · Trainingsmodus</option></select></div><div id="playerFields"></div><div class="rule">Für 2–4 Personen: Die aktive F2F-Person und die Passant*innen-Rolle sind im Gespräch. Nur andere Spielende dürfen Einwurfkarten spielen. Zu zweit gibt es daher keine externen Einwürfe.</div><button class="primary" onclick="startGame()">Partie beginnen</button></section><section class="panel"><h3>Gut zu wissen</h3><p>Pro Person vier Pitches. Bei 3–4 Spielenden: drei Handkarten zu Beginn, keine automatische Nachfüllung. Eingemischt sind genau drei zufällig ausgewählte Improkarten. Zu zweit und im Solo-Modus entfallen Einwurfhände und entsprechende Handkartenpunkte.</p><p>Die sechs Joker bilden <b>einen gemeinsamen NGO-unabhängigen Stapel</b>. Jeder Joker existiert nur einmal, maximal einer pro Pitch.</p><p>Einwurfpunkte und Gesprächspunkte werden separat gutgeschrieben. Verbleibende Einwurfkarten kosten am Spielende Punkte.</p></section></div>`}
function buildPlayers(){const n=+($('pcount')?.value||3),root=$('playerFields');if(!root)return;root.innerHTML=Array.from({length:n},(_,i)=>`<div class="field"><label>Person ${i+1}</label><input id="pn${i}" maxlength="28" placeholder="Spieler*in ${i+1}" value="${n===1?'Solo':`Person ${i+1}`}"><select id="po${i}">${NGO.map((x,j)=>`<option value="${esc(x)}" ${j===i?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`).join('')}
let deck=[];const rand=(a)=>a[Math.floor(Math.random()*a.length)];
function startGame(){const n=+($('pcount').value),people=Array.from({length:n},(_,i)=>({name:$('pn'+i).value.trim()||`Person ${i+1}`,org:$('po'+i).value,hand:[],score:0,quality:0,throwScore:0,doneBonus:0,history:[]}));
 const pool=shuffle([...ENTRY,...shuffle(IMPRO).slice(0,3)]).map(c=>c.id);
 if(n>=3){for(const p of people)p.hand=pool.splice(0,3)}else{for(const p of people)p.hand=[];}
 G={version:'2.9',players:people,turn:0,total:people.length*4,jokerDeck:shuffle(JOKERS.map(x=>x.id)),jokerUsed:[],round:null,history:[],selectedImpros:IMPRO.map(x=>x.id).filter(x=>people.some(p=>p.hand.includes(x))) };newRound();save();render()}
function newRound(){const active=G.turn%G.players.length,actor=G.players[active],passer=G.players.length===1?-1:(active+1)%G.players.length;
 const npcs=cat('NPC').filter(c=>c.org===actor.org),p=rand(cat('PASSANT')),missions=rand(cat('MISSION')),project=cat('PROJEKT').find(c=>c.org===actor.org),ngo=cat('NGO-INFO').find(c=>(c.org||c.title)===actor.org)||cat('NGO-INFO').find(c=>c.title===actor.org);
 G.round={active,passer,ngo:ngo?.id||null,npc:rand(npcs)?.id||null,passant:p?.id,mission:missions?.id,project:project?.id,phase:'pitch',knowledge:null,knowledgeBack:false,improLocked:false,improResolved:false,improText:'',throws:[],throwerIds:[],challengeUsed:false,supportUsed:false,joker:null,jokerMode:'',score:[0,0,0,0,0,0],resolved:false,issue:false,notes:'',outcome:'N'};save()}
const rp=()=>G.players[G.round.active];function round(){const r=G.round,a=rp(),pass=G.players[r.passer];const standers=G.players.map((p,i)=>i).filter(i=>i!==r.active&&i!==r.passer);const show=!!r.knowledge;
 return `<div class="row between"><div><div class="eyebrow">Runde ${G.turn+1} von ${G.total}</div><h2>${esc(a.name)} · ${esc(a.org)}</h2><p>F2F-Rolle: ${esc(by(r.npc)?.title||'Team')} ${pass?`· Passant*innen-Rolle: ${esc(pass.name)}`:'· Solo-Trainingsmodus'}</p></div><div class="row"><button class="ghost" onclick="save();goto('library')">Karten ansehen</button><button class="gold" onclick="finishTurn()">Pitch auswerten</button></div></div><div class="progress"><i style="width:${100*G.turn/G.total}%"></i></div><section class="section roleHero"><section class="panel"><div class="eyebrow">Deine Charaktere &amp; die Ausgangslage</div><div class="roundShowcase">${r.npc?roleCard(r.npc,'Aktive F2F-Rolle'):''}${r.ngo?roleCard(r.ngo,'NGO-Profil'):''}${r.project?roleCard(r.project,'Projekt'):''}${r.mission?roleCard(r.mission,'Mission'):''}</div></section><section class="panel"><div class="eyebrow">Die Begegnung</div>${r.passant?`<div class="roundShowcase">${roleCard(r.passant,'Passant*in')}</div>`:''}<div class="row section"><button onclick="showCard('${r.passant}')">Geheimes Rollenprofil</button><button class="ghost" onclick="newPassant()">Andere Passant*in</button></div><div class="rule">Nur die Person in der Passant*innen-Rolle sollte das Geheimprofil lesen. Im Solo-Modus kann die Rückseite zur Selbstreflexion geöffnet werden.</div></section></section><div class="grid grid3 section"><section class="panel"><div class="eyebrow">Gemeinsamer Jokerstapel</div><div class="stats"><span class="pill">${G.jokerDeck.length} von 6 verfügbar</span></div>${r.joker?`<div class="card">${cardFront(by(r.joker))}</div><div class="soft section"><b>${esc(by(r.joker).title)}</b><p>${esc(by(r.joker).joker_faehigkeit)}</p><p>Modus: <b>${esc(r.jokerMode||'noch nicht festgelegt')}</b></p>${r.jokerMode?'':`<div class="row"><button onclick="useRoleJoker()">Als Rolle nutzen</button><button onclick="useThrowJoker()">Als Einwurf</button></div>`}</div>`:`<p>Coach*in oder Teamleitung – von jeder NGO nutzbar, kein Doppel.</p><button class="teal" onclick="drawJoker()" ${!G.jokerDeck.length?'disabled':''}>Universal-Joker ziehen</button>`}<div class="rule">Maximal ein Joker pro Pitch. Die Karte kehrt während derselben Partie nicht zurück.</div></section><section class="panel"><h3>Wissens- oder NGO-Überzeugungskarte</h3><p>Lege eine Theorie-/Überzeugungskarte offen aus. Die Rückseite kann durch eine Improkarte gesperrt werden.</p>${!show?`<div class="row"><button onclick="drawKnowledge('WISSEN')">Theorie ziehen</button><button onclick="drawKnowledge('ARGUMENT')">NGO-Überzeugung ziehen</button></div>`:`<div class="cardVisible"><h3>${esc(by(r.knowledge).title)}</h3>${esc(by(r.knowledge).front)}</div>${r.improLocked&&!r.improResolved?`<div class="rule warning"><strong class="lock">🔒 Rückseite gesperrt</strong><p>Erkläre den Inhalt ohne umzudrehen. Erst danach darf die Karte aufgedeckt werden.</p><textarea id="improText" rows="3" placeholder="Eigene Erklärung (frei formulieren)">${esc(r.improText)}</textarea><div class="section"><button class="teal" onclick="resolveImpro()">Erklärung abgeschlossen – Rückseite freigeben</button></div></div>`:`<div class="section"><button onclick="toggleBack()">${r.knowledgeBack?'Rückseite schließen':'Rückseite aufdecken'}</button>${r.knowledgeBack?`<div class="cardVisible section">${esc(by(r.knowledge).back)}</div>`:''}</div>`}`}</section><section class="panel"><h3>Einwurfkarten der Außenstehenden</h3>${G.players.length===1?'<p>Im Solo-Modus werden die Einwürfe als optionaler Trainingsimpuls simuliert.</p>':''}${standers.length===0?'<p>Keine außenstehende Person in dieser Runde (zu zweit).</p>':''}${standers.map(i=>`<div class="soft section"><b>${esc(G.players[i].name)}</b> <small>· Hand: ${G.players[i].hand.length} Karten</small><div class="stack section">${G.players[i].hand.map(id=>`<div class="mini"><b>${esc(by(id).title)}</b><small>${esc(LABELS[by(id).cat])}</small><button class="kbtn" onclick="throwCard(${i},'${id}')" ${r.throwerIds.includes(i)?'disabled':''}>Einwerfen</button></div>`).join('')||'<small>Keine Karten mehr</small>'}</div></div>`).join('')}${r.joker&&r.jokerMode==='Einwurf'&&standers.length?`<p>Joker als Unterstützung: ${standers.map(i=>`<button class="kbtn" onclick="throwJoker(${i})">${esc(G.players[i].name)} spielt Joker</button>`).join(' ')}</p>`:''}${r.throws.length?`<div class="section"><h3>Aktive Einwürfe</h3>${r.throws.map(t=>`<div class="rule ${t.cat==='STÖRUNG'||t.cat==='IMPRO'?'warning':''}"><b>${esc(t.by)} · ${esc(by(t.id).title)}</b><p>${esc(by(t.id).front)}</p></div>`).join('')}</div>`:''}<p class="muted">Maximal ein Einwurf je außenstehender Person und Pitch; höchstens eine Herausforderung (Störung/Impro) und eine Unterstützung.</p></section></div><div class="section panel"><div class="eyebrow">Gespräch abschließen</div><h3>Auswertung</h3><p>Auf die Situation reagieren, Nein respektieren und dann gemeinsam bewerten. Keine echten Spendendaten sammeln.</p><button class="gold" onclick="finishTurn()">Zur Punktevergabe</button></div>`}
function newPassant(){if(!confirm('Passant*innenkarte für diese Runde neu ziehen?'))return;G.round.passant=rand(cat('PASSANT')).id;save();render()}
function drawKnowledge(k){G.round.knowledge=rand(cat(k)).id;G.round.knowledgeBack=false;G.round.improLocked=false;G.round.improResolved=false;save();render()}
function toggleBack(){let r=G.round;if(r.improLocked&&!r.improResolved){toast('Zuerst improvisieren – die Rückseite bleibt gesperrt.');return}r.knowledgeBack=!r.knowledgeBack;save();render()}
function resolveImpro(){const txt=$('improText').value.trim();if(txt.length<12){toast('Formuliere zunächst eine eigene kurze Erklärung, bevor die Rückseite freigegeben wird.');return}G.round.improText=txt;G.round.improResolved=true;G.round.knowledgeBack=true;save();render()}
function drawJoker(){let r=G.round;if(r.joker||!G.jokerDeck.length)return;r.joker=G.jokerDeck.shift();G.jokerUsed.push(r.joker);save();render()}
function useRoleJoker(){const r=G.round;r.jokerMode='Rollenjoker';r.originalNpc=r.npc;r.npc=r.joker;save();render()}
function useThrowJoker(){G.round.jokerMode='Einwurf';save();render()}
function throwJoker(i){const r=G.round;if(r.supportUsed||r.throwerIds.includes(i)||!r.joker||r.jokerMode!=='Einwurf'){toast('Joker als Unterstützung kann jetzt nicht mehr gespielt werden.');return}r.throws.push({by:G.players[i].name,player:i,id:r.joker,cat:'UNTERSTÜTZUNG',joker:true});r.supportUsed=true;r.throwerIds.push(i);G.players[i].throwScore+=1;save();render()}
function throwCard(i,id){const r=G.round,pl=G.players[i],c=by(id);if(i===r.active||i===r.passer||r.throwerIds.includes(i))return;let challenge=c.cat==='STÖRUNG'||c.cat==='IMPRO';if(challenge&&r.challengeUsed){toast('Pro Gespräch maximal eine Herausforderung.');return}if(!challenge&&r.supportUsed){toast('Pro Gespräch maximal eine Unterstützung.');return}if(c.cat==='IMPRO'&&!r.knowledge){toast('Improkarten benötigen eine zuvor ausgespielte Theorie- oder NGO-Überzeugungskarte.');return}if(c.cat==='IMPRO'&&r.knowledgeBack){toast('Die Rückseite wurde bereits geöffnet. Eine Improkarte muss vorher gespielt werden.');return}r.throws.push({by:pl.name,player:i,id,cat:c.cat});r.throwerIds.push(i);pl.hand=pl.hand.filter(x=>x!==id);pl.throwScore+=1;if(challenge)r.challengeUsed=true;else r.supportUsed=true;if(c.cat==='IMPRO'){r.improLocked=true;r.knowledgeBack=false;r.improResolved=false}save();render()}
function finishTurn(){G.round.phase='judge';save();render()}
const QUESTIONS=['Respektvoller Einstieg & Distanz','Zuhören & Perspektivwechsel','Gesprächsführung & Anpassung','NGO-Wissen & Wahrhaftigkeit','Freiwilligkeit & passender Abschluss','Missionsziel erfüllt'];
function judge(){let r=G.round,p=rp();return `<div class="eyebrow">Punktevergabe · Runde ${G.turn+1}</div><h2>Qualität vor Quote</h2><p>${esc(p.name)} · ${esc(p.org)}</p><div class="grid grid2"><section class="panel"><h3>Gesprächspunkte</h3><p>Jede Dimension: 0 = nicht erkennbar, 1 = teilweise, 2 = gut umgesetzt.</p><div class="scoregrid">${QUESTIONS.map((q,i)=>`<div class="scoreitem"><span>${esc(q)}</span><div class="stepper">${[0,1,2].map(v=>`<button class="${r.score[i]===v?'active':''}" onclick="setScore(${i},${v})">${v}</button>`).join('')}</div></div>`).join('')}</div><div class="section"><label><input type="checkbox" id="challenge" ${r.resolved?'checked':''} onchange="setFlag('resolved',this.checked)"> Herausforderung oder Impro erfolgreich gemeistert (+1, falls ausgespielt)</label></div><div class="section"><label><input type="checkbox" id="issue" ${r.issue?'checked':''} onchange="setFlag('issue',this.checked)"> Druck, falsche Fakten oder Sicherheitsregel verletzt (0 Gesprächspunkte)</label></div><div class="metric section"><small>Gesprächspunkte</small><strong>${r.issue?0:r.score.reduce((a,b)=>a+b,0)+(r.resolved&&r.challengeUsed?1:0)} / 13</strong></div></section><section class="panel"><h3>Ergebnis & Reflexion</h3><div class="field"><label>Gesprächsausgang</label><select id="outcome" onchange="setOutcome(this.value)"><option value="N" ${r.outcome==='N'?'selected':''}>Kein Abschluss / Nein respektiert</option><option value="I" ${r.outcome==='I'?'selected':''}>Information oder Alternative auf Wunsch</option><option value="D" ${r.outcome==='D'?'selected':''}>Freiwillige regelmäßige Spende (simuliert)</option></select></div><p>Eine Spende gibt <b>keinen automatischen Zusatzpunkt</b>. Ein respektvoll beendetes Gespräch kann ebenso gut bewertet werden.</p><div class="field"><label>Reflexion (optional)</label><textarea rows="5" id="notes" placeholder="Was lief gut? Was würde ich anders machen?">${esc(r.notes)}</textarea></div><div class="rule">Ausgespielte gültige Einwurfkarten: ${r.throws.length}. Diese Punkte zählen separat für die Einwerfenden.</div><button class="primary" onclick="completeRound()">Wertung übernehmen →</button><button class="ghost" onclick="G.round.phase='pitch';save();render()">Zurück zum Pitch</button></section></div>`}
function setScore(i,v){G.round.score[i]=v;save();render()}function setFlag(k,v){G.round[k]=v;save();render()}function setOutcome(v){G.round.outcome=v;save()}
function completeRound(){let r=G.round;r.notes=$('notes')?.value||'';let points=r.issue?0:r.score.reduce((a,b)=>a+b,0)+(r.resolved&&r.challengeUsed?1:0);let p=rp();p.quality+=points;p.score+=points;p.history.push({passant:by(r.passant)?.title||'',mission:by(r.mission)?.title||'',outcome:r.outcome,points,notes:r.notes,throws:r.throws.length,joker:r.joker?by(r.joker).title:''});G.history.push({round:G.turn+1,active:p.name,points});G.turn++;
 if(G.turn<G.total)newRound();else{G.finished=true;for(const x of G.players){x.doneBonus=G.players.length>=3?(x.hand.length?(-1*x.hand.length):2):0;x.score=x.quality+x.throwScore+x.doneBonus}}save();render()}
function summary(){const results=G.players.map(p=>({p,total:p.quality+p.throwScore+p.doneBonus})).sort((a,b)=>b.total-a.total);return `<section class="hero"><div class="eyebrow">Spielende · gemeinsam zurückblicken</div><h1>WAS NIMMST DU<br><span style="color:var(--pink)">MIT?</span></h1><p class="lead">Jede Runde bietet neue Erfahrungen. Schau, was gut funktioniert hat, wo du anders reagieren würdest und welche Fragen offenbleiben.</p><div class="row"><button class="primary" onclick="resetGame()">Neue Partie</button><button onclick="exportResults()">Ergebnisse speichern</button></div></section><div class="section grid grid2">${results.map(({p,total})=>`<div class="panel"><h2>${esc(p.name)}</h2><p>${esc(p.org)}</p><div class="metric"><small>Gesamtpunkte</small><strong>${total}</strong></div><p>Gespräch ${p.quality} · Einwürfe ${p.throwScore} · Handkarten ${p.doneBonus>=0?'+'+p.doneBonus:p.doneBonus}</p><p>Verbleibende Handkarten: ${p.hand.length}</p>${p.history.map(h=>`<div class="soft section"><b>${esc(h.passant)}</b><br><small>${esc(h.mission)} · ${h.points} Punkte</small><p>${esc(h.notes)}</p></div>`).join('')}</div>`).join('')}</div>`}
function resetGame(){if(G&&!confirm('Wirklich neue Partie beginnen?'))return;G=null;safeStore('f2f28_game',null);goto('play')}
function exportResults(){const t='F2F Fundraising Streets · Gameplay 2.11\n'+G.players.map(p=>`${p.name} / ${p.org}: ${p.score} Punkte (Pitch ${p.quality}, Einwürfe ${p.throwScore}, Hand ${p.doneBonus})\n${p.history.map(h=>`${h.passant}: ${h.points} – ${h.notes}`).join('\n')}`).join('\n\n');const url=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='F2F_Streets_Trainingsbericht_2.11.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
// Volltextsuche mit stabiler Eingabe: Die Ergebnisliste wird aktualisiert,
// ohne das Suchfeld neu zu rendern (Cursor und Tastaturfokus bleiben erhalten).
const searchNormalize = value => String(value ?? '').normalize('NFKD')
  .replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss').toLocaleLowerCase('de-DE').trim();
const CARD_SEARCH_INDEX = new Map(CARDS.map(c => [c.id, searchNormalize(
  [...Object.values(c).filter(v=>typeof v==='string'||typeof v==='number'), LABELS[c.cat]||''].join(' ')
)]));
function libraryMatches(){
 const terms=searchNormalize(libQuery).split(/\s+/).filter(Boolean);
 return CARDS.filter(c => (libCat==='ALLE'||c.cat===libCat) && terms.every(t=>CARD_SEARCH_INDEX.get(c.id).includes(t)));
}
function libraryResults(){
 const list=libraryMatches();
 return `<p role="status" aria-live="polite">${list.length} Treffer · ${Math.min(libLimit,list.length)} angezeigt</p>`+
  (list.length?`<div class="grid grid4">${list.slice(0,libLimit).map(c=>cardTile(c)).join('')}</div>`:
    `<div class="panel"><h3>Keine Treffer</h3><p>Probiere andere Begriffe oder wähle „Alle Kategorien“.</p><button class="ghost" onclick="clearLibrarySearch()">Suche zurücksetzen</button></div>`)+
  (list.length>libLimit?`<button class="section" onclick="moreLibraryResults()">Weitere 40 Karten anzeigen</button>`:'');
}
function updateLibraryResults(){const el=$('libraryResults');if(el)el.innerHTML=libraryResults();}
function searchLibrary(value){libQuery=value;libLimit=40;updateLibraryResults();}
function changeLibraryCategory(value){libCat=value;libLimit=40;updateLibraryResults();}
function moreLibraryResults(){libLimit+=40;updateLibraryResults();}
function clearLibrarySearch(){libQuery='';libCat='ALLE';libLimit=40;const q=$('query');if(q){q.value='';q.focus();}const select=$('category');if(select)select.value='ALLE';updateLibraryResults();}
function library(){return `<div class="eyebrow">Vollständige Kartenbibliothek</div><h2>${CARDS.length} Karten</h2><p>345 Druckkarten + 49 digitale Trainings- und Quellenkarten. Suche in Titeln, Kartentexten, NGOs, Beschreibungen und Kategorien.</p><div class="row section"><input style="flex:1;min-width:200px" id="query" type="search" autocomplete="off" aria-label="Karten durchsuchen" placeholder="Volltextsuche: Titel, ID, NGO, Inhalte …" value="${esc(libQuery)}" oninput="searchLibrary(this.value)"><select id="category" aria-label="Kategorie auswählen" onchange="changeLibraryCategory(this.value)"><option value="ALLE">Alle Kategorien</option>${Object.entries(LABELS).map(([k,v])=>`<option value="${esc(k)}" ${libCat===k?'selected':''}>${esc(v)} (${cat(k).length})</option>`).join('')}</select></div><div id="libraryResults" class="section">${libraryResults()}</div>`}
function rules(){return `<div class="eyebrow">Spielanleitung · Gameplay 2.11</div><h2>F2F Streets – Menschen begegnen</h2><div class="grid grid2 section"><section class="panel"><h3>1. Rollen und Decks</h3><p>1 Person: Solo-Training. 2–4 Personen: ein gemeinsames Gerät. In jeder Runde spielt eine Person den NGO-Pitch, eine andere Passant*in. Nur übrige Personen spielen Einwurfkarten.</p><p>Die NGO-Teamrollen werden nach gewählter Organisation zugeordnet. Die sechs Joker (Mika, Noa, Ari, Kim, Robin, Sam) stehen <b>allen NGOs</b> aus demselben Stapel zur Verfügung. Jede Figur existiert genau einmal.</p></section><section class="panel"><h3>2. Einwurfkarten</h3><p>Bei 3–4 Spielenden bekommt jede Person drei Karten aus Störung, Unterstützung und genau drei zufällig ausgewählten Improkarten. Zu zweit und solo entfallen Einwurfkarten und damit verbundene Handkartenpunkte. Wer gerade nicht spricht, versucht seine Handkarten loszuwerden. Maximal ein Einwurf pro außenstehender Person und Pitch; höchstens eine Herausforderung und eine Unterstützung.</p><p>Ein gültiger Einwurf: +1 für die einwerfende Person. Am Ende: +2 bei leerer Hand, sonst −1 je verbliebener Karte.</p></section><section class="panel"><h3>3. Improkarten</h3><p>Improkarten dürfen nur auf offen ausgespielte <b>Wissens- oder NGO-Überzeugungskarten</b> gelegt werden, solange deren Rückseite noch nicht gelesen wurde. Sie sperren die Rückseite, bis der Pitch die Erklärung frei formuliert hat. Erst anschließend darf aufgedeckt und überprüft werden.</p><p>Niemand muss unbekannte Fakten erfinden. Ehrliches Eingestehen von Unwissen ist zulässig.</p></section><section class="panel"><h3>4. Punkte</h3><p>Maximal 13 Gesprächspunkte: Einstieg (0–2), Zuhören (0–2), Gesprächsführung (0–2), NGO-Wissen (0–2), Freiwilligkeit (0–2), Mission (0–2) und Herausforderung/Impro erfolgreich gemeistert (+1).</p><p>Keine automatischen Abschluss- oder Jokerpunkte. Druck, Falschinformationen oder Sicherheitsverstöße führen zu null Gesprächspunkten. Ein respektiertes Nein kann erfolgreich sein.</p></section></div><div class="rule section">Dieser lokale Prototyp ist für den offenen Test gedacht. Die Kartenbibliothek und der Punktestand funktionieren offline. Eine synchrone Internet-Mehrspielerversion mit getrennten Geräten oder echten Konten ist nicht enthalten.</div>`}

const FEEDBACK_INBOX='Noch eintragen';
function faq(){return `<div class="eyebrow">Fragen & Antworten</div><h2>Fragen zum Spiel</h2><div class="grid grid2 section"><section class="panel"><details class="faqItem" open><summary>Was ist F2F Fundraising Streets?</summary><p>Ein Trainingsspiel für Face-to-Face-Fundraising, Gesprächsführung, Haltung und Teamreflexion. Es verbindet NGO-Wissen, Spielsituationen und Impro-Impulse.</p></details><details class="faqItem"><summary>Wie viele Personen können spielen?</summary><p>Der Prototyp funktioniert lokal für 1 bis 4 Personen. Im Solo-Modus trainierst du Pitch und Reflexion, mit 3–4 Personen kommen externe Einwurfkarten dazu.</p></details><details class="faqItem"><summary>Warum gibt es nur 6 Jokerkarten?</summary><p>Die sechs Joker bilden einen gemeinsamen NGO-unabhängigen Stapel. So bleibt jede Figur einzigartig und kann von allen NGOs gezogen werden.</p></details><details class="faqItem"><summary>Wie funktionieren Improkarten?</summary><p>Improkarten sperren die Rückseite einer Wissens- oder NGO-Überzeugungskarte, bis die Erklärung frei formuliert wurde. Danach darf die Rückseite zur Überprüfung aufgedeckt werden.</p></details></section><section class="panel"><details class="faqItem"><summary>Wird eine Spende automatisch mit vielen Punkten belohnt?</summary><p>Nein. Im Mittelpunkt stehen Gesprächsqualität, Zuhören, Wahrhaftigkeit, Freiwilligkeit und ein respektvoller Abschluss – auch ein ehrliches Nein kann ein gutes Ergebnis sein.</p></details><details class="faqItem"><summary>Wer darf Einwurfkarten spielen?</summary><p>Nur Personen, die gerade nicht im Gespräch sind. Sie versuchen ihre Handkarten taktisch loszuwerden. Maximal ein Einwurf pro außenstehender Person und Pitch.</p></details><details class="faqItem"><summary>Funktioniert die Online-Version auch offline?</summary><p>Ja. Die HTML-Version läuft lokal im Browser. Spielstand, Bibliothek und Formulare funktionieren ohne Server. Für echte Formularübermittlung braucht es später noch ein Backend oder einen Formdienst.</p></details><details class="faqItem"><summary>Wie kann ich mich einbringen?</summary><p>Du kannst das Spiel testen, Ideen teilen oder eine Rückmeldung zu den Materialien geben. Über „Donate“ ist auch eine freiwillige Unterstützung möglich.</p></details></section></div>`}
function submitFeedback(ev){if(ev)ev.preventDefault();const kind=$('fb_kind').value,name=$('fb_name').value.trim(),mail=$('fb_mail').value.trim(),rel=$('fb_relevance').value,msg=$('fb_msg').value.trim();if(!msg){toast('Bitte trage mindestens dein Feedback oder deine Idee ein.');return false;}const payload=`F2F Fundraising Streets · Feedback\nTyp: ${kind}\nName: ${name||'-'}\nE-Mail: ${mail||'-'}\nRelevanz: ${rel}\n\nNachricht:\n${msg}\n`; try{navigator.clipboard.writeText(payload)}catch(e){} const blob=new Blob([payload],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='F2F_Streets_Feedback.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),500); let mailto=''; if(mail){mailto=`mailto:?subject=${encodeURIComponent('F2F Streets Feedback')}&body=${encodeURIComponent(payload)}`;} modal('Feedback vorbereitet',`<p>Danke! Dein Feedback wurde als Textdatei zum Herunterladen vorbereitet. Das Kopieren in die Zwischenablage ist je nach Browser möglich.</p><p>So kannst du es direkt weiterleiten oder in ein später angeschlossenes Formularsystem einfügen.</p><p><b>Empfohlener Empfänger:</b> ${esc(FEEDBACK_INBOX)}</p>${mail?`<p><a class="primary" href="${mailto}">Im Mailprogramm öffnen</a></p>`:''}`); return false; }
function feedback(){return `<div class="eyebrow">Ideen & Rückmeldungen</div><h2>Deine Perspektive zählt</h2><div class="grid grid2 section"><section class="panel"><form class="feedbackForm" onsubmit="return submitFeedback(event)"><div class="field"><label for="fb_kind">Art des Feedbacks</label><select id="fb_kind"><option>Idee</option><option>Fehler / Bug</option><option>Regelvorschlag</option><option>Design / UX</option><option>Barrierefreiheit</option><option>Inhalt / NGO-Bezug</option><option>Sonstiges</option></select></div><div class="grid grid2"><div class="field"><label for="fb_name">Name (optional)</label><input id="fb_name" maxlength="80" placeholder="Dein Name"></div><div class="field"><label for="fb_mail">E-Mail (optional)</label><input id="fb_mail" type="email" maxlength="120" placeholder="dein.name@example.org"></div></div><div class="field"><label for="fb_relevance">Priorität / Relevanz</label><select id="fb_relevance"><option>niedrig</option><option selected>mittel</option><option>hoch</option><option>sehr hoch</option></select></div><div class="field"><label for="fb_msg">Idee oder Feedback</label><textarea id="fb_msg" placeholder="Was ist dir aufgefallen? Was würdest du anders machen?"></textarea></div><small>Hinweis: Diese lokale Version sendet noch nicht an einen Server. Beim Absenden wird ein Feedback-Text exportiert und – wenn möglich – in die Zwischenablage kopiert.</small><div class="row"><button class="primary" type="submit">Feedback vorbereiten</button><button type="button" class="ghost" onclick="document.getElementById('fb_msg').value=''">Leeren</button></div></form></section><section class="panel"><h3>Worüber wir uns freuen</h3><ul class="noteList"><li>Verständlichkeit der Regeln und Punktevergabe</li><li>Qualität und Fairness der Einwurfkarten</li><li>Balance zwischen Spielspaß, Realismus und Haltung</li><li>Lesbarkeit, Barrierefreiheit und Navigation</li><li>Weitere Kartenideen, NGO-Profile und Wissensinhalte</li></ul><div class="rule section">Das Formular exportiert deine Eingabe lokal. Eine direkte Übermittlung ist in dieser Testversion noch nicht eingerichtet.</div></section></div>`}
function support(){return `<div class="eyebrow">Projekt unterstützen</div><h2>Donate</h2><div class="ctaBox section"><section class="panel supportBox"><div class="ctaCard"><div class="row"><span class="rockstarDonate"><span class="star">★</span>Donate</span></div><h3 style="margin-top:14px">Das Spiel gemeinsam weiterdenken</h3><p>F2F Streets ist ein offener Spielprototyp. Wenn dir die Idee gefällt, kannst du neue Karten, Tests und zugänglichere Materialien freiwillig unterstützen.</p><ul class="noteList"><li>Weiterentwicklung von Karten, Regeln und Online-Version</li><li>Mehr Testläufe und Feedbackschleifen</li><li>Bessere Druck- und Webmaterialien</li></ul></div><div class="rule">Auch Ideen und Rückmeldungen helfen weiter – eine Spende ist dafür nicht nötig.</div></section><section class="panel"><div class="qrWrap"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAApEAAAKtCAIAAADw8aJKAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAAASdEVYdFNvZnR3YXJlAEdyZWVuc2hvdF5VCAUAAP+HSURBVHhe7F0FWFVL16a7pUsEQUVFsbEVsBEDLGwJG0XsBFv0GtduxQ5UkFABEUTpULq7+3T/zzlL5+7vHMCjF4P77/fZ13uAfWbP7D17vbNm1rxLhIMDhwC0dUzRZyKRAh+sradjj3/OxoEDBw4cvwQi/L/AgQPD2UQiRV5eO+BlKIfDsbGxDwgI4T8VBw4cOHD8KuCcjaMVAGcDYcfEJvbtO4zD4RQXl8IHHDhw4MDxW4BzNo5WoK1jigibw+FMmzY3MjIWPuCuNg4cOHD8LuCcjaMVWFtPR4TN4XBiYhN79hrM4XAyMrL69RvOfzYOHDhw4PglwDkbh1CYNm1uRkYWh8MZNGgs/99w4MCBA8cvAc7ZOIRCeUVlz16Dly9fm5T8if9vOHDgwIHjlwDnbBw4cODAgaNzAOdsHDhw4MCBo3MA52wcOHDgwIGjcwDnbBw4cODAgaNzAOdsHDhw4MCBo3MA52wcOHDgwIGjcwDnbBw4cODAgaNzAOdsHDhw4MCBo3MA52wcOHDgwIGjcwDnbBw4cODAgaNzAOdsHDhw4MCBo3MA52wcOHDgwIGjcwDnbBw4cODAgaNzAOdsHDhw4MCBo3MA52wcOHDgwIGjcwDnbBw4cODAgaNzAOdsHDhw4MCBo3MA52wcOHDgwIGjcwDnbBw4cODAgaNzAOdsHDhw4MCBo3MA52wcOHDgwIGjcwDnbBw4cODAgaNzAOdsHDhw4MCBo3MA52wcOHDgwIGjcwDnbBw4cODAgaNzAOdsHDhw4MCBo3MA52wcOHDgwIGjcwDnbBw4cODAgaNzAOdsHDhw4MCBo3MA52wcOHDgwIGjcwDnbBw4cODAgaNzAOdsHDhw4MCBo3MA52wcOHDgwIGjcwDnbBw4cODAgaNzAOdsHDhw4MCBo3MA52wcOHDgwIGjcwDnbBw4cODAgaNzAOdsHDhw4MCBo3MA52wcOHDgwIGjcwDnbBw4cODA function downloads(){return `<div class="shopHero"><div><div class="eyebrow" style="color:#ffe5f8">F2F Streets · Materialien</div><h2>MEHR ALS<br>EIN PITCH.</h2><p class="shopLead">Karten, Charaktere und Ideen für Begegnungen, Workshops und gemeinsame Lernmomente. Entdecke das Material in deinem Tempo – kostenlos, direkt und in dieser Testversion ohne Backend.</p><button class="gold" onclick="shopOpen('printpaket')">Druckmaterialien herunterladen</button></div><div class="shopHeroAside"><strong>345 KARTEN.<br>VIELE PERSPEKTIVEN.</strong><small>Für Übungen, Gespräche und neue Ideen im Team.</small></div></div><div class="shopToolbar"><div class="shopSearch"><input type="search" id="shopQuery" aria-label="Downloads durchsuchen" placeholder="Materialien durchsuchen …" autocomplete="off" value="${esc(shopQuery)}" oninput="shopSearch(this.value)"></div><span class="shopCount">Kostenfrei · direkt verfügbar</span></div><div class="shopFilters" id="shopFilters">${shopFilters()}</div><div id="shopResults">${shopResults()}</div><div class="shopInfoPanel"><b>Optional: E-Mail-Adresse lokal hinterlegen</b><p>Alle Dateien sind ohne Anmeldung verfügbar. Eine freiwillig hinterlegte E-Mail-Adresse bleibt nur in diesem Browser und wird nicht übermittelt. Es erfolgt keine Anmeldung für Nachrichten oder Updates.</p><p id="shopEmailStatus">${shopEmailSaved()?'Eine E-Mail-Adresse ist in diesem Browser gespeichert.':'Keine lokal gespeicherte E-Mail-Adresse.'}</p><button class="shopDeleteMail" onclick="shopEmailClear()">Gespeicherte E-Mail entfernen</button></div>`}
function shopOpen(id){const i=shopItem(id);if(!i)return;const saved=shopEmailSaved();$('overlay').innerHTML=`<div class="modalBackdrop" onclick="closeModal(event)"><section class="modalBody shopModal" role="dialog" aria-modal="true" aria-labelledby="shopModalTitle"><div class="row between"><div><div class="eyebrow">Dein Download</div><h3 id="shopModalTitle">${esc(i.title)}</h3></div><button onclick="closeModal()" aria-label="Dialog schließen">✕</button></div><p style="color:#e4d5e1">${esc(i.meta)} · ${esc(i.size)} · ${esc(i.format)}</p><div class="shopChoice"><label for="shopEmail">E-Mail-Adresse <span style="font-weight:400;color:#f0cadf">(freiwillig)</span></label><input id="shopEmail" name="email" type="email" inputmode="email" autocomplete="email" maxlength="180" placeholder="name@example.org" value="${esc(saved)}"><div class="shopPrivacy">Du kannst ohne Angabe fortfahren. In dieser Testversion bleibt eine freiwillige E-Mail-Adresse ausschließlich lokal in diesem Browser gespeichert. Keine Übertragung, keine Anmeldung, kein Backend. Falls du später Updates möchtest, kannst du dich nach Einrichtung eines sicheren Formulars gesondert dafür anmelden.</div></div><div class="shopModalActions"><button class="shopButton" onclick="shopFinish('${i.id}',false)">Direkt herunterladen</button><button class="ghost" onclick="shopFinish('${i.id}',true)">E-Mail lokal speichern und herunterladen</button></div><p style="font-size:12px;color:#bfaec3;margin-top:12px">${esc(i.desc)}</p></section></div>`;const e=$('shopEmail');if(e)e.focus()}
function shopFinish(id,withEmail){const i=shopItem(id);if(!i)return;const input=$('shopEmail');if(withEmail){const email=input?.value.trim()||'';if(email){if(!input.checkValidity()){input.reportValidity();return}try{localStorage.setItem(SHOP_LOCAL_EMAIL_KEY,email)}catch(e){}}}closeModal();const a=document.createElement('a');a.href=i.href;a.download=i.href.split('/').pop();document.body.appendChild(a);a.click();a.remove();const status=$('shopEmailStatus');if(status)status.textContent=shopEmailSaved()?'Eine E-Mail-Adresse ist in diesem Browser gespeichert.':'Keine lokal gespeicherte E-Mail-Adresse.';}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('overlay')?.innerHTML)closeModal()});

function render(){nav();if(tab==='home')$('app').innerHTML=home();else if(tab==='play'){if(!G){$('app').innerHTML=setup();buildPlayers()}else if(G.finished){$('app').innerHTML=summary()}else if(G.round.phase==='judge'){$('app').innerHTML=judge()}else $('app').innerHTML=round()}else if(tab==='library')$('app').innerHTML=library();else if(tab==='rules')$('app').innerHTML=rules();else if(tab==='downloads')$('app').innerHTML=downloads();else if(tab==='faq')$('app').innerHTML=faq();else if(tab==='feedback')$('app').innerHTML=feedback();else if(tab==='support')$('app').innerHTML=support()}
render();
</script></body></html>
